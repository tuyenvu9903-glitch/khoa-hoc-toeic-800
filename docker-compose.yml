services:
  postgres:
    image: postgres:16-alpine
    container_name: toeic-postgres
    environment:
      POSTGRES_USER: toeic
      POSTGRES_PASSWORD: toeic
      POSTGRES_DB: toeic
    ports:
      - "5432:5432"
    volumes:
      - toeic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toeic -d toeic"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  toeic_pgdata:
